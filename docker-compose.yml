services:
  # AI-TRACE: 本文件是本地全栈部署的编排入口。db/minio 提供持久化依赖，
  # minio-init/migrate 负责幂等初始化，server 只在二者成功后启动，web 再代理
  # /trpc、/game 和 /s3；环境变量名称必须与 packages/server/src/env.ts 保持一致。
  # 主机端口统一绑定 127.0.0.1：Windows Hyper-V 防火墙只需按端口放行，
  # 同时避免 WSL mirrored networking 将开发数据库、MinIO 和应用暴露到局域网。
  # PostgreSQL 数据库
  db:
    image: postgres:16
    container_name: miu2d-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-miu2d_db}
    ports:
      - "127.0.0.1:5533:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 文件存储 (S3 兼容)
  minio:
    image: minio/minio:latest
    container_name: miu2d-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9100:9000"   # API
      - "127.0.0.1:9101:9001"   # Console
    volumes:
      - ./.data/minio:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 幂等创建服务端依赖的 bucket；一次性任务成功退出后 server 才会启动。
  minio-init:
    image: minio/mc:latest
    container_name: miu2d-minio-init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_BUCKET: ${MINIO_BUCKET:-miu2d}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  # 使用生产镜像内置的 SQL runner 执行幂等迁移，避免运行时依赖 Prisma CLI。
  migrate:
    image: miu2d-server:latest
    container_name: miu2d-migrate
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-miu2d_db}
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"
    profiles:
      - production

  # 后端服务 (生产环境用)
  server:
    image: miu2d-server:latest
    container_name: miu2d-server
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-miu2d_db}
      NODE_ENV: production
      PORT: 4000
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_BUCKET: ${MINIO_BUCKET:-miu2d}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8080/s3}
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:4100:4000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles:
      - production

  # 前端服务 (生产环境用)
  web:
    image: miu2d-web:latest
    container_name: miu2d-web
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_DEMO_RESOURCES_DOMAIN: ${VITE_DEMO_RESOURCES_DOMAIN:-}
        VITE_S3_BASE_URL: ${VITE_S3_BASE_URL:-/s3/miu2d}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - production

networks:
  app-network:
    driver: bridge
