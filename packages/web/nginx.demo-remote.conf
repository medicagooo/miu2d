# AI-TRACE: WSL demo-only read path. This location is evaluated before the generic
# local /game route. It forwards only the three repository-owned landing-page slugs,
# strips browser credentials, and leaves all other games and write APIs on local services.
location ~ ^/game/(demo|sword1|sword2)/(api|resources)/ {
    proxy_pass https://miu2d.williamchan.me:10443;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name miu2d.williamchan.me;
    proxy_set_header Host miu2d.williamchan.me;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header User-Agent "Miu2D-WSL-Demo-Proxy/1.0";
    proxy_hide_header Set-Cookie;
}
